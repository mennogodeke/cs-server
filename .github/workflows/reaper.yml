name: cs2 reaper

# Safety net for the on-demand model: destroy any session server that outlived
# its game night, so a forgotten `gameday down` can't bill for days.
#
# Requires:
#   secret HCLOUD_TOKEN            - Hetzner Cloud project token
#   variable CS2_MAX_SESSION_HOURS - optional, defaults to 6

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Delete the session server now, regardless of age"
        type: boolean
        default: false

concurrency: cs2-reaper

jobs:
  reap:
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      MAX_HOURS: ${{ vars.CS2_MAX_SESSION_HOURS || '6' }}
      FORCE: ${{ inputs.force }}
      # Must match terraform's var.name_prefix (default "cs2" in both
      # terraform/bootstrap and terraform/session) — that's what labels the
      # servers this job looks for. Override via the repo/environment variable
      # if you ever change name_prefix.
      NAME_PREFIX: ${{ vars.CS2_NAME_PREFIX || 'cs2' }}
      # Bump deliberately: https://github.com/hetznercloud/cli/releases
      HCLOUD_CLI_VERSION: "v1.68.0"
    steps:
      - name: install hcloud cli (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/hetznercloud/cli/releases/download/${HCLOUD_CLI_VERSION}/hcloud-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/hetznercloud/cli/releases/download/${HCLOUD_CLI_VERSION}/checksums.txt"
          grep " hcloud-linux-amd64.tar.gz\$" checksums.txt | sha256sum -c -
          sudo tar -xzf hcloud-linux-amd64.tar.gz -C /usr/local/bin hcloud
      - name: reap stale session servers
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          servers=$(hcloud server list -l "project=${NAME_PREFIX},role=session" -o json)
          echo "$servers" | jq -c '.[]' | while read -r s; do
            id=$(jq -r '.id' <<<"$s")
            name=$(jq -r '.name' <<<"$s")
            created=$(date -u -d "$(jq -r '.created' <<<"$s")" +%s)
            age_h=$(( (now - created) / 3600 ))
            if [ "$FORCE" = "true" ] || [ "$age_h" -ge "$MAX_HOURS" ]; then
              echo "::warning::deleting $name (age ${age_h}h >= ${MAX_HOURS}h)"
              hcloud server delete "$id"
            else
              echo "keeping $name (age ${age_h}h < ${MAX_HOURS}h)"
            fi
          done
