// Bind-mounted read-only into the container. Identity/passwords come from env vars,
// not from here, so this file is safe to keep in git.

sv_hibernate_when_empty   1     // release the CPU core while the lobby waits
sv_hibernate_ms           50
sv_hibernate_ms_vgui      50

mp_autoteambalance        0
mp_limitteams             0
mp_autokick               0
sv_allow_votes            1
sv_deadtalk               1

// GOTV
tv_enable                 1
tv_delay                  90
tv_advertise_watchable    0

// Logging to stdout so `docker logs` / journald captures a match record.
log                       on
sv_logecho                1
mp_logdetail              3

// Per-session --mode behaviour (MatchZy autostart, mostly) — templated by
// cloud-init into cfg/mode.cfg, see terraform/session/main.tf.
exec mode.cfg
